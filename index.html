<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cockpit Yannlf3</title>
  <meta name="description" content="Tableau de bord freelance : conformité légale, simulation de prix, devis, factures et finances d'une micro-entreprise.">
  <meta name="theme-color" content="#0b1712">

  <!-- PWA : installable sur iPhone / iPad / Mac (Partager > Sur l'écran d'accueil) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cockpit">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="css/app.css">

  <!-- Thème appliqué AVANT le rendu pour éviter un flash clair/sombre -->
  <script>
    try { const t = localStorage.getItem('yl-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>

  <!-- Écran de connexion (mode Supabase uniquement) -->
  <section id="auth" class="auth" hidden></section>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <span class="topbar-title" id="topbarTitle">Cockpit</span>
    </header>

    <nav class="sidebar" id="sidebar" aria-label="Navigation principale">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="34" height="34">
        <div>
          <strong>Cockpit</strong>
          <span id="brandName">Yannlf3</span>
        </div>
      </div>
      <div class="nav" id="nav"></div>
      <div class="sidebar-foot">
        <span class="mode-pill" id="modePill"></span>
        <button class="theme-toggle" id="themeBtn" type="button" aria-label="Basculer clair / sombre">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <span class="theme-label"></span>
        </button>
      </div>
    </nav>
    <div class="scrim" id="scrim" hidden></div>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>

  <noscript>Ce tableau de bord nécessite JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
