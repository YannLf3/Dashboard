# Empêche la mise en pause du projet Supabase gratuit (après ~1 semaine
# sans activité) en faisant une petite requête tous les 3 jours.
# Nécessite deux secrets du repo : SUPABASE_URL et SUPABASE_ANON_KEY
# (Settings > Secrets and variables > Actions). Sans secrets, ne fait rien.
name: Supabase keepalive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets absents : rien à faire."; exit 0; fi
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "$URL/rest/v1/records?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
